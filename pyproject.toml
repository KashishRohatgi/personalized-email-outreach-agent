[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personalized-email-outreach-agent"
version = "0.1.0"
description = "Personalized email outreach agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.32.0,<1.0",
    "sqlalchemy>=2.0.36,<3.0",
    "pydantic>=2.9.2,<3.0",
    "pydantic-settings>=2.6.1,<3.0",
    "python-dotenv>=1.0.1,<2.0",
    "email-validator>=2.2.0,<3.0",
    "httpx>=0.27.2,<1.0",
    "google-genai>=1.0.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3,<9.0",
]

[tool.setuptools.packages.find]
include = ["agent*", "api*", "config*", "database*"]
